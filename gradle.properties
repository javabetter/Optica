# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ IDEA is not yet fully compatible with configuration cache on this Loom version, see:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Minecraft / Fabric — this is the ONLY block you need to touch to port to a newer version.
minecraft_version=26.2
loader_version=0.20.1
loom_version=1.17.17
fabric_api_version=0.161.0+26.2
iris_version=1.11.4+26.2-fabric
sodium_version=mc26.2-0.9.2-fabric

# Libraries (glsl-transformer/jcpp/antlr must match what Iris bundles)
glsl_transformer_version=3.0.0-pre3
jcpp_version=1.4.14
antlr_version=4.13.1
semver4j_version=3.1.0
fastutil_concurrent_wrapper_version=0.2.3

# Mod properties
mod_version=0.3.2
maven_group=com.optica
archives_base_name=optica
